[mcp_servers.fleet]
command = "node"
args = ["-e", "const p=require(\"path\"),f=require(\"fs\");for(let d=process.cwd();;d=p.dirname(d)){const l=p.join(d,\".fleet-mcp\",\"launch.mjs\");if(f.existsSync(l)){import(require(\"url\").pathToFileURL(l).href);break}if(p.dirname(d)===d){console.error(\"fleet: no .fleet-mcp/launch.mjs found above \"+process.cwd());process.exit(1)}}"]
env = { FLEET_PROJECT = "fleet" }
