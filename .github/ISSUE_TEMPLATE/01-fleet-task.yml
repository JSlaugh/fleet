name: Fleet task
description: A self-contained, PR-sized task for a fleet worker. Files as fleet:ready — a worker may claim it on the next poll.
labels: ["fleet:ready"]
body:
  - type: markdown
    attributes:
      value: |
        The worker that picks this up sees only this issue (body plus comments) — it has no other context.
        Name exact file paths wherever you know them.

        - **Priority** is a label, not a field: add `fleet:p1` / `fleet:p2` / `fleet:p3` after filing (optional).
        - **Dependencies:** put a line `Depends-on: #12, #14` anywhere below and fleet won't claim this until those issues close.
        - Not ready to queue it yet? Remove the `fleet:ready` label after filing.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's wrong or missing, and why it matters. Name the files involved if you know them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What "done" looks like, as a concrete, checkable list.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The commands or checks the worker should run to confirm the change.
      placeholder: |
        - `pnpm typecheck`
        - `pnpm test`
    validations:
      required: true
