name: Fleet task
description: File a self-contained task ticket for the fleet backlog.
title: "[Fleet]: "
body:
  - type: markdown
    attributes:
      value: |
        This is the preferred way to hand-file a fleet ticket — it structures the ticket the way the fleet-backlog skill and worker sessions expect. Priority and model tier below are not applied automatically; add the matching `fleet:*` label yourself (along with `fleet:ready` once the ticket is ready to be picked up).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's wrong or missing, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What "done" looks like, as a concrete, checkable list.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands or checks a worker should run to confirm this is done (tests, typecheck, lint, a manual repro).
      placeholder: |
        pnpm typecheck
        pnpm test
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Optional — issue numbers this ticket shouldn't be picked up until closed.
      placeholder: "#12 #14"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Add the matching label yourself (fleet:p1 / fleet:p2 / fleet:p3) — not applied automatically.
      options:
        - "P1 - highest"
        - "P2 - default"
        - "P3 - low"
      default: 1
    validations:
      required: true
  - type: dropdown
    id: model-tier
    attributes:
      label: Model tier
      description: Add the matching label yourself (fleet:light / fleet:elevate) — not applied automatically. Leave at Default unless this ticket is trivial or unusually hard.
      options:
        - "Default"
        - "Light"
        - "Elevate"
      default: 0
    validations:
      required: true
